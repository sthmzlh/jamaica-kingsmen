name: Update cricket data

on:
  push:
    branches: [main]
    paths:
      - scripts/update-data.mjs
      - .github/workflows/update-data.yml
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cricket-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch verified match and player data
        run: node scripts/update-data.mjs

      - name: Publish changes when data changed
        run: |
          if git diff --quiet -- data/team.json; then
            echo "No cricket data changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/team.json
          git commit -m "Update Jamaica Kingsmen match data"
          git pull --rebase
          git push

